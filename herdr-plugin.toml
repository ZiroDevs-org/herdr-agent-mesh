id = "herdr-agent-mesh"
name = "Herdr Agent Mesh"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Provider-neutral discovery and explicitly authorized directed messages for local Herdr panes."
platforms = ["linux", "macos"]

[[actions]]
id = "discover"
title = "Discover Herdr topology"
description = "Read the verified current tab, or an explicitly supplied tab/workspace scope."
command = ["herdr-agent-mesh", "discover", "--json"]

[[actions]]
id = "send"
title = "Send directed message"
description = "Send only after reviewing and explicitly authorizing the exact pane and text."
command = ["herdr-agent-mesh", "send", "--target-pane", "<pane_id>", "--text", "<text>", "--authorize"]

[[build]]
command = ["bun", "install"]

[[build]]
command = ["bun", "run", "build"]

[[panes]]
id = "herdr-agent-mesh-daemon"
title = "Herdr Agent Mesh daemon"
placement = "sidebar"
command = ["herdr-agent-mesh-daemon"]

[[startup]]
id = "herdr-agent-mesh-daemon"
command = ["herdr-agent-mesh-daemon"]

[[events]]
id = "herdr-agent-mesh-topology"
event = "topology_changed"
command = ["herdr-agent-mesh", "discover", "--json"]
